    if (vivo) { m.position.x += .35 * Math.sin(t * .23); m.rotation.y += .5 * Math.sin(t * .17); }   // nada para um lado e outro
    if (ESP && !/sonda|horizons/.test(B.modelo)) { m.rotation.set(.12, t * .09, 0); m.position.x = 0; }   // planeta gira
    if (B.cam === 'passagem') { m.position.x = lerp(-3.2, 3.2, u); m.rotation.y = 0; }
