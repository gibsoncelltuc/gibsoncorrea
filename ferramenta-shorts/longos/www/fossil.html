<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
// Formato "Fossil" (EUA): cada bloco = uma era. Animais em ESCALA REAL lado a lado, cenario da era (mar ou terra), nota de TIER no fim do bloco, tier list final.
import * as THREE from './lib/three.module.js';
import { GLTFLoader } from './lib/GLTFLoader.js';
const W = 1920, H = 1080, FPS = 30;
const SPEC = await (await fetch('spec.json?t=' + Date.now())).json();
const ren = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); ren.setSize(W, H); ren.setPixelRatio(1);
ren.outputColorSpace = THREE.SRGBColorSpace; ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out); const g = out.getContext('2d');
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x000000, 0.03);
const cam = new THREE.PerspectiveCamera(36, W / H, 0.05, 400);
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x3a3020, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 }); scene.add(sun); scene.add(sun.target);
const rnd = (i) => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
// chao (terra: cor da era / mar: areia escura)
const chao = new THREE.Mesh(new THREE.CircleGeometry(120, 64), new THREE.MeshStandardMaterial({ color: 0x6a5a40, roughness: 1 })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; scene.add(chao);
// relevo leve no chao (pedrinhas)
const pedras = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x555048, roughness: 1, flatShading: true }), 160);
{ const m4 = new THREE.Matrix4(); for (let i = 0; i < 160; i++) { const r = 6 + rnd(i) * 40, a = rnd(i + 5) * 6.283, s = .1 + rnd(i + 9) * .6; m4.compose(new THREE.Vector3(Math.cos(a) * r, s * .3, Math.sin(a) * r), new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd(i) * 3, rnd(i + 1) * 3, 0)), new THREE.Vector3(s, s * .6, s)); pedras.setMatrixAt(i, m4); } }
pedras.receiveShadow = true; scene.add(pedras);
// particulas (mar: neve marinha / terra frio: neve caindo)
const N = 2200, pos = new Float32Array(N * 3); for (let i = 0; i < N; i++) { pos[i * 3] = (rnd(i) - .5) * 40; pos[i * 3 + 1] = rnd(i + 7) * 14; pos[i * 3 + 2] = (rnd(i + 13) - .5) * 40; }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const part = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: .8, depthWrite: false })); scene.add(part);
// raios de luz no mar
const raios = new THREE.Group(); for (let i = 0; i < 7; i++) { const p = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 40), new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: .05, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })); p.position.set((rnd(i) - .5) * 24, 12, (rnd(i + 3) - .5) * 16 - 4); p.rotation.z = .25; raios.add(p); } scene.add(raios);

const loader = new GLTFLoader(), MOD = {}; const carregar = (n) => new Promise((r, e) => loader.load(n.includes('/') ? `assets/library/${n}.glb` : `assets/library/kit/${n}.glb`, (gl) => r(gl.scene), undefined, e));
const nomes = new Set(); for (const b of SPEC.blocos) { for (const m of b.modelos || []) nomes.add(m.n); for (const x of b.extras || []) nomes.add(x.n); if (b.flora) nomes.add(b.flora); }
for (const n of nomes) {
  const o = await carregar(n); const box = new THREE.Box3().setFromObject(o), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  o.position.set(-c.x, -box.min.y, -c.z); const base = new THREE.Group(); base.add(o);   // origem no chao, centro no meio
  o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; if (m.material) { m.material.roughness = .8; m.material.metalness = 0; } } });
  MOD[n] = { base, comp: Math.max(sz.x, sz.z), alt: sz.y, inst: [] };
}
function instancia(n, k) { const M = MOD[n]; while (M.inst.length <= k) { const c = M.base.clone(); c.visible = false; scene.add(c); M.inst.push(c); } return M.inst[k]; }
const ease = (t) => t * t * (3 - 2 * t), cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const TIERC = { S: '#ff4d4d', A: '#ff9f40', B: '#ffd84a', C: '#9be15d', D: '#5db8e1', F: '#8a8a8a' };

function frame(f) {
  const t = f / FPS, i = SPEC.blocos.findIndex((b) => t >= b.a && t < b.b), bi = i < 0 ? SPEC.blocos.length - 1 : i, B = SPEC.blocos[bi], u = cl((t - B.a) / Math.max(.1, B.b - B.a));
  for (const M of Object.values(MOD)) M.inst.forEach((x) => (x.visible = false));
  const MAR = B.amb === 'mar';
  // ambiente
  const ceu = new THREE.Color(B.ceu || (MAR ? '#0a3a5a' : '#9cc4e4')), cchao = new THREE.Color(B.chao || (MAR ? '#3a3a30' : '#7a6a48'));
  scene.background = ceu; scene.fog.color.copy(ceu); scene.fog.density = MAR ? .07 : (B.nevoa || .018);
  chao.material.color.copy(cchao); pedras.material.color.copy(cchao).multiplyScalar(.75);
  hemi.color.set(MAR ? 0x6fb6ff : 0xdff0ff); hemi.groundColor.copy(cchao).multiplyScalar(.5); hemi.intensity = MAR ? 1.5 : 1.0;
  sun.color.set(MAR ? 0x9fd8ff : (B.frio ? 0xe6f0ff : 0xfff0d8)); sun.intensity = MAR ? 2.4 : 2.6;
  raios.visible = MAR; raios.children.forEach((p, k) => (p.material.opacity = .035 + .02 * Math.sin(t * .8 + k)));
  part.visible = MAR || !!B.frio; part.material.size = MAR ? .04 : .07;
  { const a = pg.attributes.position; for (let j = 0; j < N; j++) { const y0 = pos[j * 3 + 1]; a.array[j * 3 + 1] = ((y0 - t * (MAR ? .15 : .9) * (.5 + rnd(j))) % 14 + 14) % 14; a.array[j * 3] = pos[j * 3] + Math.sin(t * .5 + j) * .3; } a.needsUpdate = true; }
  // escala real: o maior animal do bloco = 4.2 unidades de comprimento
  const ms = B.lista ? [] : (B.modelos || []); const maxm = Math.max(...ms.map((m) => m.m), .1); const U = 4.2 / maxm; let totalw = 0;
  const lista = ms.map((m) => { const M = MOD[m.n]; const k = (m.m * U) / M.comp; const w = M.comp * k; totalw += w; return { m, M, k, w }; });
  const gap = .6; totalw += gap * (lista.length - 1); let x = -totalw / 2; const yb = MAR ? 1.4 : 0;
  lista.forEach(({ m, M, k, w }, j) => { const o = instancia(m.n, 0); o.visible = true; o.scale.setScalar(k); x += w / 2;
    const bob = MAR ? .15 * Math.sin(t * 1.2 + j) : 0; o.position.set(x, yb + bob + (m.y || 0) * U, (m.z || 0) * U); o.rotation.set(0, (m.ry || 0) + (MAR ? .08 * Math.sin(t * .6 + j) : 0), MAR ? .04 * Math.sin(t + j) : 0); x += w / 2 + gap; });
  // extras (cardumes, plantas pequenas): espalhados na frente/atras
  (B.extras || []).forEach((e, je) => { const M = MOD[e.n]; const k = (e.m * U) / M.comp; for (let q = 0; q < (e.q || 1); q++) { const o = instancia(e.n, q); o.visible = true; o.scale.setScalar(Math.max(k, e.min || 0)); const r = 1.2 + rnd(q + je * 31) * 4.5, a = rnd(q * 3 + je) * 6.283; o.position.set(Math.cos(a) * r * 1.3, (e.voa ? 1.5 + rnd(q) * 1.5 + .2 * Math.sin(t * 3 + q) : 0) + (MAR && e.voa ? 0 : 0), Math.sin(a) * r - 1); o.rotation.y = rnd(q + 11) * 6.28 + (e.voa ? t * .3 : 0); } });
  // flora: em volta, longe da camera
  if (B.flora) { const M = MOD[B.flora]; const k = (B.flora_m || 3.5) / M.alt; for (let q = 0; q < 26; q++) { const o = instancia(B.flora, q); o.visible = true; o.scale.setScalar(k * (.7 + rnd(q + 40) * .6)); const a = -Math.PI * .1 + rnd(q + 3) * Math.PI * 1.2 + Math.PI, r = 8 + rnd(q + 8) * 20; o.position.set(Math.cos(a) * r, 0, Math.sin(a) * r * .8 - 2); o.rotation.y = rnd(q) * 6.28; } }
  // camera: de lado (comparar tamanhos), com orbita suave
  const span = Math.max(totalw, 3), R = span * 1.15 + 2.4, az = (B.cam === 'close' ? lerp(.35, .1, ease(u)) : lerp(-.45, .45, u)) + (B.az || 0);
  const alvoY = (MAR ? yb : 0) + Math.min(2.2, Math.max(.6, Math.max(...lista.map((l) => l.M.alt * l.k), 1) * .45));
  const RR = B.cam === 'close' ? R * lerp(.8, .62, ease(u)) : R;
  cam.position.set(Math.sin(az) * RR, alvoY + .8 + RR * .12, Math.cos(az) * RR); cam.lookAt(0, alvoY, 0);
  sun.target.position.set(0, 0, 0);
  ren.render(scene, cam); g.drawImage(ren.domElement, 0, 0);
  const fade = Math.min(cl((t - B.a) / .4), cl((B.b - t) / .4)); if (fade < 1) { g.fillStyle = `rgba(0,0,0,${1 - fade})`; g.fillRect(0, 0, W, H); }
  const vg = g.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.lineJoin = 'round';
  const txt = (s, x, y, size, col, al = 'left', bw = 10, peso = 900) => { g.font = `${peso} ${size}px "Arial Black", Impact, sans-serif`; g.textAlign = al; g.lineWidth = bw; g.strokeStyle = '#000'; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y); };
  const op = cl((t - B.a - .3) / .5);
  if (B.rotulo && op > 0) { g.globalAlpha = op; txt(B.rotulo, 70, 118, 70, '#ffffff'); g.globalAlpha = 1; }
  if (B.prof && op > 0) { g.globalAlpha = op; g.font = '900 40px "Arial Black"'; const bw2 = g.measureText(B.prof).width + 60; g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(W - 70 - bw2, 66, bw2, 74); g.strokeStyle = '#ffd84a'; g.lineWidth = 4; g.strokeRect(W - 70 - bw2, 66, bw2, 74); txt(B.prof, W - 70 - bw2 / 2, 118, 40, '#ffe9a8', 'center', 6); g.globalAlpha = 1; }
  // nomes + tamanho embaixo de cada animal
  if (op > 0 && ms.length) { const v = new THREE.Vector3(); g.globalAlpha = op;
    lista.forEach(({ m }) => { const o = MOD[m.n].inst[0]; v.set(o.position.x, o.position.y - .25, o.position.z).project(cam); const sx = (v.x + 1) / 2 * W, sy = Math.min(H - 190, (1 - v.y) / 2 * H + 40);
      if (m.rotulo) { txt(m.rotulo, sx, sy, 38, '#ffffff', 'center', 8); txt(m.tam || '', sx, sy + 44, 30, '#ffd84a', 'center', 7); } }); g.globalAlpha = 1; }
  // titulo do video no gancho
  if (bi === 0 && t < 6 && SPEC.titulo) { const o2 = Math.min(cl(t / .6), cl((6 - t) / .6)); g.globalAlpha = o2; txt(SPEC.titulo.toUpperCase(), W / 2, H / 2 - 40, 70, '#ffffff', 'center', 14); g.globalAlpha = 1; }
  // NOTA DE TIER no fim do bloco
  if (B.tier) { const ta = B.b - 4.6; if (t > ta) { const p = cl((t - ta) / .35), esc = 1 + .25 * Math.sin(p * Math.PI) * (1 - p) + (1 - p) * .4; const s = 230 * esc, cx = W - 330, cy = H / 2 - 30;
      g.globalAlpha = p; g.fillStyle = TIERC[B.tier]; g.strokeStyle = '#000'; g.lineWidth = 10; g.fillRect(cx - s / 2, cy - s / 2, s, s); g.strokeRect(cx - s / 2, cy - s / 2, s, s);
      g.font = `900 ${170 * esc}px "Arial Black"`; g.textAlign = 'center'; g.fillStyle = '#111'; g.fillText(B.tier, cx, cy + 60 * esc);
      txt(B.veredito || (B.tier + ' TIER'), cx, cy + s / 2 + 70, 48, '#ffffff', 'center', 9); g.globalAlpha = 1; } }
  // TIER LIST (no bloco final): todas as eras por nota
  if (B.lista && SPEC.tiers) { const p = cl((t - B.a - .6) / .8); g.globalAlpha = p; const rows = ['S', 'A', 'B', 'C', 'D', 'F'], x0 = 140, y0 = 190, rh = 118, ww = W - 280;
    rows.forEach((r, k) => { const y = y0 + k * (rh + 8); g.fillStyle = 'rgba(20,20,24,.85)'; g.fillRect(x0, y, ww, rh); g.fillStyle = TIERC[r]; g.fillRect(x0, y, 130, rh); g.font = '900 80px "Arial Black"'; g.textAlign = 'center'; g.fillStyle = '#111'; g.fillText(r, x0 + 65, y + 88);
      let xx = x0 + 160; (SPEC.tiers[r] || []).forEach((nm) => { g.font = '800 36px Arial'; const w2 = g.measureText(nm).width + 36; g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(xx, y + 30, w2, 60); g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(nm, xx + 18, y + 72); xx += w2 + 14; }); }); g.globalAlpha = 1; }
  // legenda (ingles)
  const fr = (B.frases || []).find((q) => t >= q[0] && t < q[1]);
  if (fr && !(B.lista && t > B.a + .6)) { const words = fr[2].split(' '), lines = ['']; g.font = '800 52px Arial, sans-serif'; for (const w of words) { const s = (lines[lines.length - 1] + ' ' + w).trim(); if (g.measureText(s).width > 1450) lines.push(w); else lines[lines.length - 1] = s; }
    lines.forEach((l, k) => { const y = H - 64 - (lines.length - 1 - k) * 64; g.textAlign = 'center'; g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(l, W / 2, y); g.fillStyle = '#fff'; g.fillText(l, W / 2, y); }); }
}
window.renderFrame = frame; window.getFrame = (q) => out.toDataURL('image/jpeg', q); window.ready = true;
</script></body></html>
